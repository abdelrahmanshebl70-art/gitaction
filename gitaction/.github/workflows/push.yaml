on:
  push:
    branches:
      - main
      - "release/**"
    paths:
      - "src/**"
  pull_request:
    branches:
      - main
      - master
    paths:
      - "src/**"

jobs:
  myjob:
    runs-on: ubuntu-latest
    steps:
      - name: check
        uses: actions/checkout@v4.2.2
      - name: run test
        run: npm test