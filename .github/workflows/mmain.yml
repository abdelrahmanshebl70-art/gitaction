name: Test Failure Function

on:
  workflow_dispatch: # لتتمكن من تشغيله بضغطة زر يدويًا

jobs:
  demo-job:
    runs-on: ubuntu-latest
    steps:
      # الخطوة الأولى: تنجح بشكل طبيعي
      - name: Step 1 - Success Step
        run: echo "1. الخطوة الأولى تمت بنجاح!"

      # الخطوة الثانية: سنتعمد إحداث خطأ فيها
      - name: Step 2 - Failing Step
        run: |
          echo "2. جاري تنفيذ خطوة ستفشل الآن..."
          exit 1  # هذا الأمر يخبر Linux والـ Action بأن الخطوة فشلت!

      # الخطوة الثالثة: خطوة عادية (بدون شرط)
      - name: Step 3 - Normal Step
        run: echo "3. هذه الخطوة لن تصل إليها أصلًا بسبب فشل الخطوة 2"

      # الخطوة الرابعة: تحتوي على شرط failure()
      - name: Step 4 - Failure Handler
        if: failure()
        run: echo "4.  الدالة failure() كشفت الفشل وقامت بتشغيل هذه الخطوة بنجاح!"
